# =====================================================================
# 証券会社の紹介データ
# ---------------------------------------------------------------------
# A8.net で広告（プログラム）の提携が承認されたら、その会社の a8_text に
# A8 の「テキストリンク」の広告コードをそのまま貼り付けてください。
#   ・貼り付けると、サイト内のボタンが自動で A8 の広告リンクに切り替わります。
#   ・空欄のままなら、ボタンは公式サイトへの通常リンクになります。
#   ・a8_banner にはバナー広告のコードを貼ると、紹介カードの下に表示されます（任意）。
#   ・コードは「|」の次の行から、行頭にスペース4つを入れて貼ってください。
#
# 例）
#   a8_text: |
#     <a href="https://px.a8.net/svt/ejp?a8mat=XXXXXX" rel="nofollow">SBI証券の口座開設はこちら</a>
#     <img border="0" width="1" height="1" src="https://www14.a8.net/0.gif?a8mat=XXXXXX" alt="">
#
# ※ points（特徴）は 2026年10月時点の各社公式サイトの情報です。
#    条件が変わることがあるので、ときどき公式サイトで確認して更新してください。
# =====================================================================

- id: sbi
  name: SBI証券
  official_url: https://www.sbisec.co.jp/
  catch: 国内株の売買手数料0円（条件あり）。ポイント投資やクレカ積立にも対応
  points:
    - 国内株式の売買手数料が0円（インターネットコースで、取引報告書などを電子交付にする設定が必要）
    - 三井住友カードなど、対象のクレジットカードで投資信託の積立ができる
    - VポイントまたはPontaポイントで投資信託を買える（メインポイントの設定が必要）
    - 投資信託は100円から購入できる
  a8_text: ""
  a8_banner: ""

