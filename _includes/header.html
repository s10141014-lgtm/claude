<div class="pr-bar" role="note">当サイトはアフィリエイト広告（PR）を利用しています</div>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M7 22l6-6 4 4 8-9"/></svg>
      <span>{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="メインメニュー">
      {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
